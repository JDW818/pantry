name: Save recipe

# Fires on every new issue. There is deliberately no label filter: labels
# can't be created from the GitHub mobile app, and this repo has no other
# use for issues. pantry.py decides whether the body is actually a recipe.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase needs history when the app has pushed meanwhile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip cache on purpose: it needs a dependency file to hash, and the
      # install takes about seven seconds. Not worth a required file that
      # breaks the whole run when it's missing.
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install anthropic requests yt-dlp
          fi

      - name: Install ffmpeg
        # Only needed when a caption is too short and we fall back to audio.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Extract recipe
        id: extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          # Reels often carry the method only in the voiceover. Whisper is
          # installed on demand, so this costs nothing until a post turns up
          # with a caption too thin to use. Set a repo variable named
          # PANTRY_TRANSCRIBE to 0 to turn it off.
          PANTRY_TRANSCRIBE: ${{ vars.PANTRY_TRANSCRIBE || '1' }}
        run: python scripts/pantry.py

      # The web app writes plan.json and list-state.json straight to main, so
      # the remote often moves while extraction is running. Rebase and retry
      # rather than losing the recipe we just paid to extract.
      - name: Commit the recipe
        id: commit
        if: steps.extract.outputs.saved == 'true'
        env:
          TITLE: ${{ steps.extract.outputs.title }}
        run: |
          set -e
          git config user.name  "pantry"
          git config user.email "pantry@users.noreply.github.com"
          git add recipes/
          git commit -m "add: $TITLE"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — someone else wrote first, rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 4) + 1 ))
          done

          echo "::error::could not push after 5 attempts"
          exit 1

      - name: Report back and close
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.existsSync('comment.md')
              ? fs.readFileSync('comment.md', 'utf8')
              : 'Something went wrong and no report was written. Check the run log.';
            if ('${{ steps.extract.outputs.saved }}' === 'true'
                && '${{ steps.commit.outcome }}' !== 'success') {
              body += "\n\n---\n\n**The recipe was extracted but couldn't be saved to the "
                    + "repository.** Someone else wrote to it at the same time and the retries "
                    + "ran out. Re-open or re-send this link to try again.";
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
            // Only close when a recipe actually landed. An issue left open is
            // the signal that something needs looking at -- a job that goes
            // green while quietly saving nothing is worse than a failure.
            // Saved AND pushed. A commit that never landed leaves the issue
            // open, because the recipe isn't really in the repo.
            const saved  = '${{ steps.extract.outputs.saved }}' === 'true';
            const pushed = '${{ steps.commit.outcome }}' === 'success';
            if (!saved || !pushed) return;
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
