name: Save recipe

# Fires when anyone opens an issue labelled "recipe". The phone Shortcut
# creates that issue; everything else happens here.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  extract:
    if: contains(github.event.issue.labels.*.name, 'recipe')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install anthropic requests yt-dlp

      - name: Install ffmpeg
        # Only needed when a caption is too short and we fall back to audio.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Extract recipe
        id: extract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          PANTRY_TRANSCRIBE: ${{ vars.PANTRY_TRANSCRIBE }}
        run: python scripts/pantry.py

      - name: Commit the recipe
        if: steps.extract.outputs.saved == 'true'
        run: |
          git config user.name  "pantry"
          git config user.email "pantry@users.noreply.github.com"
          git add recipes/
          git commit -m "add: ${{ steps.extract.outputs.title }}"
          git push

      - name: Report back and close
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('comment.md')
              ? fs.readFileSync('comment.md', 'utf8')
              : 'Something went wrong and no report was written. Check the run log.';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
            // Only close when a recipe actually landed. An issue left open is
            // the signal that something needs looking at -- a job that goes
            // green while quietly saving nothing is worse than a failure.
            const saved = '${{ steps.extract.outputs.saved }}' === 'true';
            if (!saved) return;
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
